[package]
name = "fetchline-app"
version = "0.1.0"
description = "fetchline desktop shell"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[lib]
name = "fetchline_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fetchline-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fetchline-core = { path = "../crates/fetchline-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
