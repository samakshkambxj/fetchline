<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fetchline</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="main.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Primary">
    <button class="rail-fab" id="fab-add" title="Add download" aria-label="Add download">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="rail-item is-active" data-view="downloads">
      <span class="rail-pill"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></span>
      <span>Downloads</span>
    </button>
    <button class="rail-item" data-view="scheduled">
      <span class="rail-pill"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
      <span>Scheduled</span>
    </button>
    <button class="rail-item" data-view="finished">
      <span class="rail-pill"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11l-8.5 8.5a2.1 2.1 0 0 1-3-3L15 12"/><path d="M15 12L5.5 2.5a2.1 2.1 0 0 0-3 3L12 15"/></svg></span>
      <span>Finished</span>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-item" data-view="settings">
      <span class="rail-pill"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
      <span>Settings</span>
    </button>
    <button class="icon-btn" id="theme-toggle" title="Theme: system" aria-label="Cycle theme">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>

  <div class="content">
    <header class="topbar">
      <h1 id="view-title">Downloads</h1>
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search downloads" aria-label="Search downloads">
      </label>
    </header>

    <main>
      <section class="view is-visible" id="view-downloads">
        <div class="stats-row">
          <div class="stat-card"><span class="stat-num" id="stat-active">0</span><span class="stat-label">Active</span></div>
          <div class="stat-card"><span class="stat-num" id="stat-queued">0</span><span class="stat-label">Queued</span></div>
          <div class="stat-card"><span class="stat-num" id="stat-speed">0 B/s</span><span class="stat-label">Speed</span></div>
        </div>
        <div class="card-list" id="card-list"></div>
        <div class="empty" id="empty-downloads" hidden>
          <div class="empty-shape"></div>
          <p class="empty-title">Nothing here yet</p>
          <p class="empty-sub">Hit + to queue your first download</p>
        </div>
      </section>

      <section class="view" id="view-scheduled">
        <div class="card-list" id="card-scheduled"></div>
        <div class="empty" id="empty-scheduled">
          <div class="empty-shape"></div>
          <p class="empty-title">No scheduled downloads</p>
          <p class="empty-sub">Add a URL with a future start time</p>
        </div>
      </section>

      <section class="view" id="view-finished">
        <div class="card-list" id="card-finished"></div>
        <div class="empty" id="empty-finished">
          <div class="empty-shape"></div>
          <p class="empty-title">Nothing finished</p>
          <p class="empty-sub">Completed downloads land here</p>
        </div>
      </section>

      <section class="view" id="view-settings">
        <div class="settings-card">
          <h2>Transfers</h2>
          <label class="setting-row">
            <span>Connections per file</span>
            <span class="segmented" id="seg-connections">
              <button data-v="1">1</button><button data-v="4">4</button><button data-v="8" class="is-on">8</button><button data-v="16">16</button>
            </span>
          </label>
          <label class="setting-row">
            <span>Speed limit</span>
            <span class="segmented" id="seg-speed">
              <button data-v="0" class="is-on">Off</button><button data-v="1048576">1 MiB/s</button><button data-v="5242880">5 MiB/s</button>
            </span>
          </label>
          <label class="setting-row">
            <span><span class="setting-name">Verify SHA-256</span><span class="setting-sub">Check integrity when known</span></span>
            <button class="switch" id="sw-verify" role="switch" aria-checked="false"><span class="knob"></span></button>
          </label>
          <label class="setting-row">
            <span><span class="setting-name">Start at login</span><span class="setting-sub">Launch daemon with your session</span></span>
            <button class="switch" id="sw-autostart" role="switch" aria-checked="true"><span class="knob"></span></button>
          </label>
        </div>
        <div class="settings-card">
          <h2>Appearance</h2>
          <label class="setting-row">
            <span>Theme</span>
            <span class="segmented" id="seg-theme">
              <button data-v="system" class="is-on">System</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
            </span>
          </label>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet-add" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="handle"></div>
  <h2 id="sheet-title">Add download</h2>
  <label class="field">
    <span>URLs, one per line (max 100)</span>
    <textarea id="add-urls" rows="4" placeholder="https://example.com/file.iso"></textarea>
  </label>
  <div class="sheet-row">
    <label class="field inline">
      <span>Connections</span>
      <span class="segmented small" id="seg-add-conn">
        <button data-v="1">1</button><button data-v="8" class="is-on">8</button><button data-v="16">16</button>
      </span>
    </label>
  </div>
  <div class="sheet-actions">
    <button class="btn text" id="add-cancel">Cancel</button>
    <button class="btn filled" id="add-confirm">Queue</button>
  </div>
</div>

<div class="snackbar" id="snackbar" hidden></div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
