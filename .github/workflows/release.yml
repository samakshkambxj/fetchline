name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # CLI + daemon binaries: pure Rust, no system WebKit needed.
  binaries:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p fetchline -p fetchlined --locked
      - run: |
          mkdir -p dist
          cp target/release/fetchline target/release/fetchlined dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/
          if-no-files-found: error

  # Desktop app: needs WebKitGTK system libraries.
  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli --version "^2" --locked
      - run: bash scripts/bundle-sidecar.sh
      - run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: app-bundles
          # Workspace target dir: tauri builds into ./target, not src-tauri/target.
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    needs: [binaries, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: app-bundles
          path: bundles/
      - run: |
          mkdir -p assets
          cp dist/fetchline dist/fetchlined assets/
          tar -czf assets/fetchline-cli-x86_64.tar.gz -C assets fetchline fetchlined
          rm assets/fetchline assets/fetchlined
          find bundles -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} assets/ \;
          (cd assets && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: assets/*
